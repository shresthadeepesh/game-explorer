name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No bundler, so the checks are the build. The smoke test drives a real
      # browser against a real server, so both have to be up first; the ubuntu
      # runner ships Chrome at a path scripts/smoke.mjs already looks for.
      - name: Serve the site
        run: |
          npm start &
          npx --yes wait-on http://localhost:4173 --timeout 60000

      - run: npm run test

      - uses: actions/configure-pages@v5

      # Everything the page loads is a relative path, so the site works
      # unchanged under /game-explorer/. Only the files the browser asks for
      # are published: .git alone is larger than the site.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp -R index.html manifest.webmanifest sw.js icon.svg icon-maskable.svg \
                .nojekyll src data assets _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
