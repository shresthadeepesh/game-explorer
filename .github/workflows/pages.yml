name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No bundler, so the checks are the build. The smoke test drives a real
      # browser against a real server, so both have to be up first; the ubuntu
      # runner ships Chrome at a path scripts/smoke.mjs already looks for.
      - name: Serve the site
        run: |
          npm start &
          npx --yes wait-on http://localhost:4173 --timeout 60000

      - run: npm run test

      # Pages itself is enabled in the repository settings, under
      # Pages -> Source -> GitHub Actions. The workflow token cannot create
      # the site: `enablement: true` here fails with `Resource not accessible
      # by integration`.
      - uses: actions/configure-pages@v5

      # The same staging step `npm run deploy` runs, so the two publish
      # routes cannot end up with different file lists.
      - run: npm run build:site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
